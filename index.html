<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guavion — Launching Soon</title>
    <meta name="description" content="Guavion is launching June 8, 2026. Stay tuned.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-top: #070b1a;
            --bg-bottom: #0d1333;
            --accent: #3cdc78;
            --glow: rgba(60, 220, 120, 0.12);
            --text-color: rgba(255, 255, 255, 0.7);
            --muted-color: rgba(255, 255, 255, 0.15);
            --panel-bg: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.1);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            overflow: auto;
            color: #fff;
        }

        /* --- Particle Canvas --- */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* --- Ambient Glow Orbs --- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: drift 25s ease-in-out infinite alternate;
        }

        .orb.a {
            width: 500px;
            height: 500px;
            background: var(--accent);
            top: -15%;
            right: -8%;
        }

        .orb.b {
            width: 400px;
            height: 400px;
            background: var(--accent);
            bottom: -12%;
            left: -6%;
            animation-delay: -12s;
            opacity: 0.15;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -50px) scale(1.15);
            }

            100% {
                transform: translate(-25px, 35px) scale(0.9);
            }
        }

        /* --- Content --- */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            padding-top: 60px;
            animation: fadeUp 1.2s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Title --- */
        .title {
            font-size: clamp(3rem, 8vw, 6.5rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            filter: drop-shadow(0 0 40px var(--glow));
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.15s;
            display: flex;
            cursor: default;
            font-family: "Cherry Bomb One", system-ui;
        }

        .title .letter {
            display: inline-block;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1.4),
                filter 0.35s ease;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .title .letter:hover {
            transform: translateY(-8px) scale(1.15);
            filter: drop-shadow(0 0 20px var(--accent));
        }

        .title .letter.pop {
            animation: letterPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.4);
        }

        @keyframes letterPop {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(0.75) rotate(-8deg);
            }

            60% {
                transform: scale(1.3) rotate(4deg);
                filter: drop-shadow(0 0 30px var(--accent));
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* --- Countdown --- */
        .countdown-container {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.3s;
        }

        .countdown-row {
            display: flex;
            align-items: baseline;
        }

        .countdown-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .digit-group {
            display: flex;
        }

        .digit-slot {
            width: 0.65em;
            height: 1.15em;
            overflow: hidden;
            position: relative;
            font-size: clamp(3.2rem, 9vw, 6rem);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #fff;
            text-align: center;
            line-height: 1.15em;
        }

        .digit-slot .digit-inner {
            display: flex;
            flex-direction: column;
        }

        .digit-slot .digit-inner .d-top,
        .digit-slot .digit-inner .d-bot {
            height: 1.15em;
            line-height: 1.15em;
            text-align: center;
        }

        .countdown-sep {
            font-size: clamp(2.4rem, 7vw, 4.5rem);
            font-weight: 200;
            color: rgba(255, 255, 255, 0.2);
            padding: 0 clamp(2px, 0.8vw, 8px);
        }

        .unit-label {
            font-size: clamp(0.5rem, 1.2vw, 0.7rem);
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.5;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
        }

        /* --- Subtitle --- */
        .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.05rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.5);
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.45s;
        }

        .subtitle span {
            color: var(--accent);
            font-weight: 600;
        }

        /* --- Contact Form --- */
        .contact-form {
            width: min(480px, 88vw);
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.55s;
        }

        .contact-form .form-row {
            display: flex;
            gap: 15px;
        }

        .contact-form .field {
            flex: 1;
            position: relative;
        }

        .contact-form .field input,
        .contact-form .field textarea {
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 30px 15px 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            resize: none;
        }

        .form-header {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .contact-form .field.full textarea {
            border-radius: 12px;
        }

        .contact-form .field label {
            position: absolute;
            top: 11px;
            left: 16px;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .contact-form .field input:focus~label,
        .contact-form .field textarea:focus~label {
            opacity: 0.9;
        }

        .contact-form .field input::placeholder,
        .contact-form .field textarea::placeholder {
            color: var(--muted-color);
        }

        .contact-form .field input:focus,
        .contact-form .field textarea:focus {
            background: var(--panel-bg);
            border-color: var(--accent);
            z-index: 1;
            position: relative;
        }

        .form-status {
            font-size: 0.78rem;
            text-align: center;
            min-height: 0;
            transition: opacity 0.3s ease;
        }

        .form-status:empty {
            display: none;
        }

        .form-status.success {
            color: #34d399;
        }

        .form-status.error {
            color: #f87171;
        }

        .form-submit {
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-submit:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 30px var(--glow);
        }

        .form-submit:active {
            transform: scale(0.98);
        }

        .form-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .hp {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            width: 0;
            overflow: hidden;
        }

        @media (max-width: 540px) {
            .contact-form .form-row {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <canvas id="particles"></canvas>
    <div class="orb a"></div>
    <div class="orb b"></div>

    <div class="content">
        <h1 class="title" id="title">
            <span class="letter">G</span><span class="letter">U</span><span class="letter">A</span><span
                class="letter">V</span><span class="letter">I</span><span class="letter">O</span><span
                class="letter">N</span>
        </h1>

        <div class="countdown-container" id="countdown-container">
            <div class="countdown-row">
                <div class="countdown-unit">
                    <div class="digit-group" id="d-days"></div>
                    <div class="unit-label">days</div>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-unit">
                    <div class="digit-group" id="d-hours"></div>
                    <div class="unit-label">hrs</div>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-unit">
                    <div class="digit-group" id="d-mins"></div>
                    <div class="unit-label">min</div>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-unit">
                    <div class="digit-group" id="d-secs"></div>
                    <div class="unit-label">sec</div>
                </div>
            </div>
        </div>

        <p class="subtitle">Something big is coming<span>.</span></p>

        <form class="contact-form" id="contactForm">
            <input type="hidden" name="access_key" value="17f5c547-8298-412d-ad01-1b3cacc3715c">
            <div class="hp"><input type="text" name="botcheck" tabindex="-1" autocomplete="off"></div>
            <div class="form-header">Reach Out</div>
            <div class="form-row">
                <div class="field">
                    <input type="text" id="cf-name" name="name" placeholder="Jane Doe" required>
                    <label for="cf-name">Name</label>
                </div>
                <div class="field">
                    <input type="email" id="cf-email" name="email" placeholder="you@email.com" required>
                    <label for="cf-email">Email</label>
                </div>
            </div>
            <div class="field full">
                <textarea id="cf-msg" name="message" rows="3" placeholder="What's on your mind?" required></textarea>
                <label for="cf-msg">Message</label>
            </div>
            <div class="form-status" id="formStatus"></div>
            <button type="submit" class="form-submit" id="formSubmit">Send</button>
        </form>
    </div>

    <script>
        // =====================================================
        //  THEME
        // =====================================================

        function applyTheme() {
            const ds = document.documentElement.style;
            ds.setProperty('--bg-top', '#000000');
            ds.setProperty('--bg-bottom', '#000000');
            ds.setProperty('--accent', 'rgb(60,220,120)');
            ds.setProperty('--glow', 'rgba(60,220,120,0.12)');
            ds.setProperty('--text-color', 'rgba(255, 255, 255, 0.9)');
            ds.setProperty('--muted-color', 'rgba(255, 255, 255, 0.15)');
            ds.setProperty('--panel-bg', 'rgba(255, 255, 255, 0.06)');
            ds.setProperty('--panel-border', 'rgba(255, 255, 255, 0.1)');
            document.body.style.background = '#000000';
            return { acc: [60, 220, 120] };
        }

        // Convert direction angle (radians) to an HSL color string
        function dirToColor(angle, alpha) {
            const hue = ((angle * 180 / Math.PI) + 360) % 360;
            return `hsla(${hue}, 85%, 60%, ${alpha})`;
        }

        // =====================================================
        //  BOIDS FLOCKING SIMULATION
        // =====================================================

        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse tracking
        const mouse = { x: -9999, y: -9999, active: false };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
        });
        window.addEventListener('mouseleave', () => { mouse.active = false; });
        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.active = false; });

        // Boid parameters
        const BOID_COUNT = 150;
        const MAX_SPEED = 1;
        const MIN_SPEED = 0.45;
        const MAX_FORCE = 0.045;     // gentle steering = smooth arcs
        const PERCEPTION = 90;       // wider neighborhood = larger flocks
        const SEP_RADIUS = 24;       // separation distance
        const MOUSE_RADIUS = 170;    // mouse repulsion range
        const MOUSE_FORCE = 0.35;    // mouse repulsion strength
        const EDGE_MARGIN = 80;
        const EDGE_FORCE = 0.15;

        // Weights for the three rules
        const W_SEP = 1.5;
        const W_ALI = 1.2;
        const W_COH = 0.8;

        const TRAIL_LENGTH = 50;

        class Boid {
            constructor(x, y, swarm) {
                this.x = x;
                this.y = y;
                this.swarm = swarm;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (MAX_SPEED - MIN_SPEED) + MIN_SPEED;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.ax = 0;
                this.ay = 0;
                this.trail = [];
            }

            applyForce(fx, fy) {
                this.ax += fx;
                this.ay += fy;
            }

            // Steer towards a target velocity
            steer(tx, ty) {
                // desired minus current
                let sx = tx - this.vx;
                let sy = ty - this.vy;
                const mag = Math.hypot(sx, sy);
                if (mag > MAX_FORCE) { sx = sx / mag * MAX_FORCE; sy = sy / mag * MAX_FORCE; }
                return [sx, sy];
            }

            flock(boids) {
                let sepX = 0, sepY = 0, sepN = 0;
                let aliX = 0, aliY = 0, aliN = 0;
                let cohX = 0, cohY = 0, cohN = 0;

                for (const other of boids) {
                    if (other === this) continue;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < SEP_RADIUS && dist > 0) {
                        sepX -= dx / dist / dist;
                        sepY -= dy / dist / dist;
                        sepN++;
                    }

                    if (other.swarm === this.swarm && dist < PERCEPTION) {
                        aliX += other.vx;
                        aliY += other.vy;
                        aliN++;
                        cohX += other.x;
                        cohY += other.y;
                        cohN++;
                    }
                }

                if (sepN > 0) {
                    const mag = Math.hypot(sepX, sepY);
                    if (mag > 0) { sepX = sepX / mag * MAX_SPEED; sepY = sepY / mag * MAX_SPEED; }
                    const [sx, sy] = this.steer(sepX, sepY);
                    this.applyForce(sx * W_SEP, sy * W_SEP);
                }

                if (aliN > 0) {
                    aliX /= aliN; aliY /= aliN;
                    const mag = Math.hypot(aliX, aliY);
                    if (mag > 0) { aliX = aliX / mag * MAX_SPEED; aliY = aliY / mag * MAX_SPEED; }
                    const [sx, sy] = this.steer(aliX, aliY);
                    this.applyForce(sx * W_ALI, sy * W_ALI);
                }

                // If pack is overcrowded, weaken cohesion and push away from center
                const packSize = swarmN[this.swarm] || 1;
                const overcrowded = packSize > SWARM_CAP;
                const cohScale = overcrowded ? 0.2 : 1;

                if (cohN > 0) {
                    cohX = cohX / cohN - this.x;
                    cohY = cohY / cohN - this.y;
                    const mag = Math.hypot(cohX, cohY);
                    if (mag > 0) { cohX = cohX / mag * MAX_SPEED; cohY = cohY / mag * MAX_SPEED; }
                    const [sx, sy] = this.steer(cohX, cohY);
                    this.applyForce(sx * W_COH * cohScale, sy * W_COH * cohScale);
                }

                // Overcrowded boids flee their pack center
                if (overcrowded) {
                    const cx = swarmCx[this.swarm];
                    const cy = swarmCy[this.swarm];
                    const dx = this.x - cx;
                    const dy = this.y - cy;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        const flee = 0.08;
                        this.applyForce(dx / dist * flee, dy / dist * flee);
                    }
                }
            }

            avoidMouse() {
                if (!mouse.active) return;
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.hypot(dx, dy);
                if (dist < MOUSE_RADIUS && dist > 0) {
                    const strength = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
                    this.applyForce(dx / dist * strength, dy / dist * strength);
                }
            }

            avoidEdges() {
                const w = canvas.width, h = canvas.height;
                if (this.x < EDGE_MARGIN) this.applyForce(EDGE_FORCE * (1 - this.x / EDGE_MARGIN), 0);
                if (this.x > w - EDGE_MARGIN) this.applyForce(-EDGE_FORCE * (1 - (w - this.x) / EDGE_MARGIN), 0);
                if (this.y < EDGE_MARGIN) this.applyForce(0, EDGE_FORCE * (1 - this.y / EDGE_MARGIN));
                if (this.y > h - EDGE_MARGIN) this.applyForce(0, -EDGE_FORCE * (1 - (h - this.y) / EDGE_MARGIN));
            }

            update() {
                this.vx += this.ax;
                this.vy += this.ay;
                // Clamp speed to range [MIN_SPEED, MAX_SPEED]
                const speed = Math.hypot(this.vx, this.vy);
                if (speed > MAX_SPEED) {
                    this.vx = this.vx / speed * MAX_SPEED;
                    this.vy = this.vy / speed * MAX_SPEED;
                } else if (speed < MIN_SPEED && speed > 0) {
                    this.vx = this.vx / speed * MIN_SPEED;
                    this.vy = this.vy / speed * MIN_SPEED;
                }
                this.x += this.vx;
                this.y += this.vy;
                this.ax = 0;
                this.ay = 0;

                // Record trail
                this.trail.push(this.x, this.y);
                if (this.trail.length > TRAIL_LENGTH * 2) {
                    this.trail.splice(0, 2);
                }

                // Wrap as fallback
                const w = canvas.width, h = canvas.height;
                if (this.x < -20) this.x = w + 20;
                if (this.x > w + 20) this.x = -20;
                if (this.y < -20) this.y = h + 20;
                if (this.y > h + 20) this.y = -20;
            }
        }

        // Initialize boids in separate swarms
        const boids = [];
        const SWARM_COUNT = 4;
        const SWARM_CAP = Math.ceil(BOID_COUNT / SWARM_COUNT * 1.35);

        for (let s = 0; s < SWARM_COUNT; s++) {
            const cx = (s % 2 + 0.5) / 2 * canvas.width + (Math.random() - 0.5) * 100;
            const cy = (Math.floor(s / 2) + 0.5) / 2 * canvas.height + (Math.random() - 0.5) * 100;
            const n = Math.floor(BOID_COUNT / SWARM_COUNT);
            for (let i = 0; i < n; i++) {
                boids.push(new Boid(
                    cx + (Math.random() - 0.5) * 100,
                    cy + (Math.random() - 0.5) * 100,
                    s
                ));
            }
        }

        // Dynamic pack rebalancing — runs each frame
        const swarmCx = new Float64Array(SWARM_COUNT);
        const swarmCy = new Float64Array(SWARM_COUNT);
        const swarmN = new Uint16Array(SWARM_COUNT);
        const EVEN_COUNT = Math.floor(BOID_COUNT / SWARM_COUNT);
        const swarmOverTime = new Float64Array(SWARM_COUNT); // seconds each pack has been oversized
        let lastRebalanceTime = performance.now();

        function rebalanceSwarms() {
            const now = performance.now();
            const dt = (now - lastRebalanceTime) / 1000; // seconds since last call
            lastRebalanceTime = now;

            // Compute centroids and counts
            swarmCx.fill(0); swarmCy.fill(0); swarmN.fill(0);
            for (const b of boids) {
                swarmCx[b.swarm] += b.x;
                swarmCy[b.swarm] += b.y;
                swarmN[b.swarm]++;
            }
            for (let i = 0; i < SWARM_COUNT; i++) {
                if (swarmN[i] > 0) {
                    swarmCx[i] /= swarmN[i];
                    swarmCy[i] /= swarmN[i];
                }
            }

            // Track how long each pack has been above even distribution
            for (let i = 0; i < SWARM_COUNT; i++) {
                if (swarmN[i] > EVEN_COUNT) {
                    swarmOverTime[i] += dt;
                } else {
                    swarmOverTime[i] = 0;
                }
            }

            // Find the smallest pack
            let smallest = 0;
            for (let i = 1; i < SWARM_COUNT; i++) {
                if (swarmN[i] < swarmN[smallest]) smallest = i;
            }

            // Force-eject boids from packs that have been oversized for 3+ seconds
            for (let s = 0; s < SWARM_COUNT; s++) {
                if (swarmOverTime[s] < 3) continue;
                if (swarmN[s] <= EVEN_COUNT) continue;

                // Eject a batch of boids to bring closer to even
                const excess = swarmN[s] - EVEN_COUNT;
                const toEject = Math.max(1, Math.ceil(excess * 0.4));
                const members = boids.filter(b => b.swarm === s);
                // Sort by distance from center — eject outermost first
                members.sort((a, b2) => {
                    const da = Math.hypot(a.x - swarmCx[s], a.y - swarmCy[s]);
                    const db = Math.hypot(b2.x - swarmCx[s], b2.y - swarmCy[s]);
                    return db - da;
                });

                let ejected = 0;
                for (let j = 0; j < members.length && ejected < toEject; j++) {
                    const b = members[j];
                    // Find best target pack
                    let target = -1, targetDist = Infinity;
                    for (let i = 0; i < SWARM_COUNT; i++) {
                        if (i === s || swarmN[i] >= SWARM_CAP) continue;
                        const d = Math.hypot(b.x - swarmCx[i], b.y - swarmCy[i]);
                        if (d < targetDist) { targetDist = d; target = i; }
                    }
                    if (target < 0 && smallest !== s && swarmN[smallest] < SWARM_CAP) {
                        target = smallest;
                    }
                    if (target >= 0) {
                        swarmN[b.swarm]--;
                        b.swarm = target;
                        swarmN[target]++;
                        ejected++;
                        if (swarmN[target] > swarmN[smallest]) {
                            smallest = 0;
                            for (let i = 1; i < SWARM_COUNT; i++) {
                                if (swarmN[i] < swarmN[smallest]) smallest = i;
                            }
                        }
                    }
                }
                // Reset the timer so we don't eject every single frame
                swarmOverTime[s] = 0;
            }

            // Boids in oversized packs leave on their own (cap-based)
            for (const b of boids) {
                if (swarmN[b.swarm] <= SWARM_CAP) continue;

                const myDist = Math.hypot(b.x - swarmCx[b.swarm], b.y - swarmCy[b.swarm]);
                // Outliers leave first — the farther from center, the more likely
                if (Math.random() > myDist / 300) continue;

                // Try to join a nearby smaller pack, or the smallest one
                let target = -1, targetDist = Infinity;
                for (let i = 0; i < SWARM_COUNT; i++) {
                    if (i === b.swarm || swarmN[i] >= SWARM_CAP) continue;
                    const d = Math.hypot(b.x - swarmCx[i], b.y - swarmCy[i]);
                    if (d < targetDist) { targetDist = d; target = i; }
                }

                // If no nearby pack, join the smallest
                if (target < 0 && smallest !== b.swarm && swarmN[smallest] < SWARM_CAP) {
                    target = smallest;
                }

                if (target >= 0) {
                    swarmN[b.swarm]--;
                    b.swarm = target;
                    swarmN[target]++;
                    // Update smallest tracker
                    if (swarmN[target] > swarmN[smallest]) {
                        smallest = 0;
                        for (let i = 1; i < SWARM_COUNT; i++) {
                            if (swarmN[i] < swarmN[smallest]) smallest = i;
                        }
                    }
                }
            }

            // Guarantee no empty packs — seed from the largest
            for (let i = 0; i < SWARM_COUNT; i++) {
                if (swarmN[i] > 0) continue;
                let largest = 0;
                for (let j = 1; j < SWARM_COUNT; j++) {
                    if (swarmN[j] > swarmN[largest]) largest = j;
                }
                if (swarmN[largest] <= 1) continue;
                // Grab a few boids from the edge of the largest pack
                const members = boids.filter(b => b.swarm === largest);
                members.sort((a, b2) => {
                    const da = Math.hypot(a.x - swarmCx[largest], a.y - swarmCy[largest]);
                    const db = Math.hypot(b2.x - swarmCx[largest], b2.y - swarmCy[largest]);
                    return db - da;
                });
                const toMove = Math.min(Math.floor(swarmN[largest] / 4), members.length);
                for (let j = 0; j < toMove; j++) {
                    swarmN[largest]--;
                    members[j].swarm = i;
                    swarmN[i]++;
                }
            }
        }

        // --- Background star particles ---
        const stars = [];
        const STAR_COUNT = Math.min(140, Math.floor(window.innerWidth * window.innerHeight / 7000));
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.6 + 0.3,
                dx: (Math.random() - 0.5) * 0.12,
                dy: (Math.random() - 0.5) * 0.12,
                base: Math.random() * 0.55 + 0.15,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.001 + 0.0004
            });
        }

        function drawStars(time) {
            for (const s of stars) {
                s.x += s.dx;
                s.y += s.dy;
                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                const twinkle = Math.sin(time * s.speed + s.phase) * 0.4 + 0.6;
                const alpha = s.base * twinkle;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220,225,240,${alpha})`;
                ctx.fill();
            }
        }

        // --- Combined render loop ---
        function drawFrame(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Particles first (behind boids)
            drawStars(time || 0);

            // Rebalance packs then update boids
            rebalanceSwarms();

            for (const b of boids) {
                b.flock(boids);
                b.avoidMouse();
                b.avoidEdges();
                b.update();
            }

            // Draw boids with direction-colored tapered ribbon trails
            const boidSize = 3;
            const headHalfW = boidSize * 0.7;

            for (const b of boids) {
                const pts = b.trail;
                const count = pts.length / 2;
                const speed = Math.hypot(b.vx, b.vy);
                const boidAlpha = 0.15 + (speed / MAX_SPEED) * 0.25;

                // Draw ribbon trail if we have enough points
                if (count >= 2) {
                    const leftX = [], leftY = [], rightX = [], rightY = [];
                    const segAngles = [];
                    for (let i = 0; i < count; i++) {
                        const px = pts[i * 2], py = pts[i * 2 + 1];
                        let nx, ny;
                        if (i < count - 1) {
                            nx = pts[(i + 1) * 2] - px;
                            ny = pts[(i + 1) * 2 + 1] - py;
                        } else {
                            nx = b.vx;
                            ny = b.vy;
                        }
                        const len = Math.hypot(nx, ny) || 1;
                        const perpX = -ny / len;
                        const perpY = nx / len;
                        segAngles.push(Math.atan2(ny, nx));

                        const t = i / (count - 1);
                        const halfW = t * headHalfW;

                        leftX.push(px + perpX * halfW);
                        leftY.push(py + perpY * halfW);
                        rightX.push(px - perpX * halfW);
                        rightY.push(py - perpY * halfW);
                    }

                    for (let i = 0; i < count - 1; i++) {
                        const t = i / (count - 1);
                        const alpha = t * boidAlpha * 0.7;
                        const segAngle = segAngles[i];
                        ctx.beginPath();
                        ctx.moveTo(leftX[i], leftY[i]);
                        ctx.lineTo(leftX[i + 1], leftY[i + 1]);
                        ctx.lineTo(rightX[i + 1], rightY[i + 1]);
                        ctx.lineTo(rightX[i], rightY[i]);
                        ctx.closePath();
                        ctx.fillStyle = dirToColor(segAngle, alpha);
                        ctx.fill();
                    }
                }

                // Draw boid triangle on top, colored by current direction
                const angle = Math.atan2(b.vy, b.vx);
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(boidSize * 1.6, 0);
                ctx.lineTo(-boidSize, boidSize * 0.7);
                ctx.lineTo(-boidSize * 0.4, 0);
                ctx.lineTo(-boidSize, -boidSize * 0.7);
                ctx.closePath();
                ctx.fillStyle = dirToColor(angle, boidAlpha);
                ctx.fill();
                ctx.restore();
            }
        }

        (function animate(t) {
            drawFrame(t);
            requestAnimationFrame(animate);
        })();

        // =====================================================
        //  ROLLING COUNTDOWN
        // =====================================================

        const TARGET = new Date('2026-06-08T00:00:00');


        // Create digit slots — each slot has an inner column with two cells
        // Rolls down: new value placed on top, inner slides down, then resets
        function createDigitSlots(containerId, count) {
            const el = document.getElementById(containerId);
            const slots = [];
            for (let i = 0; i < count; i++) {
                const slot = document.createElement('div');
                slot.className = 'digit-slot';
                const inner = document.createElement('div');
                inner.className = 'digit-inner';
                const top = document.createElement('div');
                top.className = 'd-top';
                top.textContent = '0';
                const bot = document.createElement('div');
                bot.className = 'd-bot';
                bot.textContent = '0';
                inner.appendChild(top);
                inner.appendChild(bot);
                slot.appendChild(inner);
                el.appendChild(slot);
                slots.push({ el: slot, inner, top, bot, value: '0', animating: false });
            }
            return slots;
        }

        const digitSlots = {
            days: createDigitSlots('d-days', 3),
            hours: createDigitSlots('d-hours', 2),
            mins: createDigitSlots('d-mins', 2),
            secs: createDigitSlots('d-secs', 2),
        };

        function updateDigit(slot, newVal) {
            if (slot.value === newVal || slot.animating) return;
            slot.animating = true;
            // Place new value on top (hidden above), current value on bottom (visible)
            slot.top.textContent = newVal;
            slot.bot.textContent = slot.value;
            // Reset to top position instantly
            slot.inner.style.transition = 'none';
            slot.inner.style.transform = 'translateY(-50%)';
            // Force reflow then animate down
            void slot.inner.offsetHeight;
            slot.inner.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
            slot.inner.style.transform = 'translateY(0)';
            setTimeout(() => {
                slot.bot.textContent = newVal;
                slot.inner.style.transition = 'none';
                slot.inner.style.transform = 'translateY(0)';
                slot.value = newVal;
                slot.animating = false;
            }, 370);
        }

        function updateCountdown() {
            const now = new Date();
            const diff = Math.max(0, TARGET - now);
            const totalSecs = Math.floor(diff / 1000);

            const d = Math.floor(totalSecs / 86400);
            const h = Math.floor((totalSecs % 86400) / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;

            const dStr = String(d).padStart(3, '0');
            const hStr = String(h).padStart(2, '0');
            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');

            function setGroup(slots, str) {
                for (let i = 0; i < slots.length; i++) {
                    const isLeadingZero = str[i] === '0' && i < slots.length - 1 && str.slice(0, i + 1) === '0'.repeat(i + 1);
                    slots[i].el.style.display = isLeadingZero ? 'none' : '';
                    if (!isLeadingZero) updateDigit(slots[i], str[i]);
                }
            }

            setGroup(digitSlots.days, dStr);
            setGroup(digitSlots.hours, hStr);
            setGroup(digitSlots.mins, mStr);
            setGroup(digitSlots.secs, sStr);
        }

        // =====================================================
        //  INIT
        // =====================================================

        // Letter click interaction
        document.querySelectorAll('.title .letter').forEach(el => {
            el.addEventListener('click', () => {
                el.classList.remove('pop');
                void el.offsetWidth;
                el.classList.add('pop');
            });
            el.addEventListener('animationend', () => el.classList.remove('pop'));
        });

        // Apply theme
        applyTheme();

        // Start countdown immediately, then update every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // =====================================================
        //  CONTACT FORM
        // =====================================================

        const form = document.getElementById('contactForm');
        const formStatus = document.getElementById('formStatus');
        const submitBtn = document.getElementById('formSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            formStatus.textContent = '';
            formStatus.className = 'form-status';

            const data = new FormData(form);
            try {
                const res = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: data
                });
                const json = await res.json();
                if (json.success) {
                    formStatus.textContent = 'Sent! we\'ll get back to you soon.';
                    formStatus.className = 'form-status success';
                    form.reset();
                } else {
                    throw new Error(json.message || 'Something went wrong');
                }
            } catch (err) {
                formStatus.textContent = err.message || 'Failed to send. Try again.';
                formStatus.className = 'form-status error';
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send';
        });
    </script>
</body>

</html>
