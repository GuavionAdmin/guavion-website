<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guavion — Launching Soon</title>
    <meta name="description" content="Guavion is launching June 8, 2026. Stay tuned.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --clock-size: 8px;
            --transition-speed: 0.8s;
            --bg-top: #070b1a;
            --bg-bottom: #0d1333;
            --accent: #00d2ff;
            --glow: rgba(0, 210, 255, 0.12);
            --text-color: rgba(255, 255, 255, 0.7);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            overflow: hidden;
            color: #fff;
        }

        /* --- Particle Canvas --- */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* --- Ambient Glow Orbs --- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: drift 25s ease-in-out infinite alternate;
        }

        .orb.a {
            width: 500px;
            height: 500px;
            background: var(--accent);
            top: -15%;
            right: -8%;
        }

        .orb.b {
            width: 400px;
            height: 400px;
            background: var(--accent);
            bottom: -12%;
            left: -6%;
            animation-delay: -12s;
            opacity: 0.15;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -50px) scale(1.15);
            }

            100% {
                transform: translate(-25px, 35px) scale(0.9);
            }
        }

        /* --- Content --- */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            animation: fadeUp 1.2s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Title --- */
        .title {
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            filter: drop-shadow(0 0 40px var(--glow));
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.15s;
            display: flex;
            cursor: default;
        }

        .title .letter {
            display: inline-block;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1.4),
                filter 0.35s ease;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .title .letter:hover {
            transform: translateY(-8px) scale(1.15);
            filter: drop-shadow(0 0 20px var(--accent));
        }

        .title .letter.pop {
            animation: letterPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.4);
        }

        @keyframes letterPop {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(0.75) rotate(-8deg);
            }

            60% {
                transform: scale(1.3) rotate(4deg);
                filter: drop-shadow(0 0 30px var(--accent));
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* --- Countdown Panel --- */
        .countdown-panel {
            background: rgba(12, 12, 18, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 32px 36px 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                0 0 60px var(--glow);
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.3s;
        }

        .countdown-groups {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .countdown-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .digit-row {
            display: flex;
            gap: calc(var(--clock-size) * 0.35);
        }

        .group-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.7;
        }

        /* --- Colon Separators --- */
        .sep {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 28px 2px 0;
        }

        .sep-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        .sep-dot:nth-child(2) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 0.75;
                transform: scale(1.3);
            }
        }

        /* --- Kinetic Clock Elements --- */
        .digit-grid {
            display: grid;
            grid-template-columns: repeat(8, var(--clock-size));
            grid-template-rows: repeat(12, var(--clock-size));
            gap: 1px;
        }

        .clock {
            width: var(--clock-size);
            height: var(--clock-size);
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #141414);
        }

        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            width: 2px;
            height: 45%;
            transform-origin: bottom center;
            border-radius: 1px;
            will-change: transform;
            transition: all var(--transition-speed) cubic-bezier(0.5, 0, 0.2, 1);
            background-color: rgba(55, 55, 55, 0.9);
        }

        .hand.active {
            background-color: rgba(255, 255, 255, 0.92);
        }

        .hand.hour {
            z-index: 2;
        }

        .hand.minute {
            z-index: 1;
        }

        /* --- Subtitle --- */
        .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.05rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.5);
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.45s;
        }

        .subtitle span {
            color: var(--accent);
            font-weight: 600;
        }

        /* --- Contact Form --- */
        .contact-form {
            width: min(480px, 88vw);
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeUp 1.2s ease-out both;
            animation-delay: 0.55s;
        }

        .contact-form .form-row {
            display: flex;
            gap: 15px;
        }

        .contact-form .field {
            flex: 1;
            position: relative;
        }

        .contact-form .field input,
        .contact-form .field textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px 15px 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            resize: none;
        }

        .form-header {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .contact-form .field.full textarea { border-radius: 12px; }

        .contact-form .field label {
            position: absolute;
            top: 11px;
            left: 16px;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .contact-form .field input:focus ~ label,
        .contact-form .field textarea:focus ~ label {
            opacity: 0.9;
        }

        .contact-form .field input::placeholder,
        .contact-form .field textarea::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .contact-form .field input:focus,
        .contact-form .field textarea:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            z-index: 1;
            position: relative;
        }

        .form-status {
            font-size: 0.78rem;
            text-align: center;
            min-height: 0;
            transition: opacity 0.3s ease;
        }

        .form-status:empty { display: none; }
        .form-status.success { color: #34d399; }
        .form-status.error { color: #f87171; }

        .form-submit {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-submit:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 30px var(--glow);
        }

        .form-submit:active {
            transform: scale(0.98);
        }

        .form-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .hp {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            width: 0;
            overflow: hidden;
        }

        @media (max-width: 540px) {
            .contact-form .form-row {
                flex-direction: column;
            }
        }

        /* --- Responsive --- */
        @media (max-width: 820px) {
            :root {
                --clock-size: 6px;
            }

            .countdown-panel {
                padding: 24px 20px 20px;
                border-radius: 18px;
            }

            .countdown-groups {
                gap: 6px;
            }
        }

        @media (max-width: 540px) {
            :root {
                --clock-size: 4px;
            }

            .countdown-panel {
                padding: 18px 12px 14px;
                border-radius: 14px;
            }

            .countdown-groups {
                gap: 4px;
            }

            .group-label {
                font-size: 0.5rem;
                letter-spacing: 0.15em;
            }

            .sep {
                gap: 14px;
                padding-top: 18px;
            }

            .sep-dot {
                width: 3px;
                height: 3px;
            }

            .hand {
                width: 1.5px;
            }
        }

        @media (max-width: 380px) {
            :root {
                --clock-size: 3px;
            }

            .countdown-groups {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px 4px;
            }

            .sep {
                display: none;
            }
        }
    </style>
</head>

        const TIME_STOPS = [
            { h: 0, top: [7, 11, 26], bot: [13, 19, 51], acc: [91, 141, 239] },
            { h: 4, top: [10, 14, 39], bot: [26, 16, 64], acc: [139, 92, 246] },
            { h: 5.5, top: [26, 14, 61], bot: [61, 31, 109], acc: [192, 132, 252] },
            { h: 6.5, top: [120, 50, 30], bot: [249, 115, 22], acc: [251, 146, 60] },
            { h: 8, top: [30, 64, 175], bot: [59, 130, 246], acc: [96, 165, 250] },
            { h: 11, top: [3, 105, 161], bot: [56, 189, 248], acc: [34, 211, 238] },
            { h: 14, top: [30, 64, 175], bot: [99, 102, 241], acc: [129, 140, 248] },
            { h: 17, top: [147, 51, 234], bot: [249, 115, 22], acc: [245, 158, 11] },
            { h: 18.5, top: [88, 28, 135], bot: [147, 51, 234], acc: [192, 132, 252] },
            { h: 20, top: [30, 27, 75], bot: [15, 23, 42], acc: [99, 102, 241] },
            { h: 22, top: [7, 11, 26], bot: [13, 19, 51], acc: [91, 141, 239] },
            { h: 24, top: [7, 11, 26], bot: [13, 19, 51], acc: [91, 141, 239] },
        ];

        function lerpC(a, b, t) {
            return [
                Math.round(a[0] + (b[0] - a[0]) * t),
                Math.round(a[1] + (b[1] - a[1]) * t),
                Math.round(a[2] + (b[2] - a[2]) * t)
            ];
        }

        function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

        function getTimeTheme() {
            const now = new Date();
            const hour = now.getHours() + now.getMinutes() / 60;
            let i = 0;
            while (i < TIME_STOPS.length - 1 && TIME_STOPS[i + 1].h <= hour) i++;
            const a = TIME_STOPS[i], b = TIME_STOPS[Math.min(i + 1, TIME_STOPS.length - 1)];
            const range = b.h - a.h || 1;
            const t = Math.max(0, Math.min(1, (hour - a.h) / range));
            return {
                top: lerpC(a.top, b.top, t),
                bot: lerpC(a.bot, b.bot, t),
                acc: lerpC(a.acc, b.acc, t)
            };
        }

        function applyTheme() {
            const th = getTimeTheme();
            document.documentElement.style.setProperty('--bg-top', rgb(th.top));
            document.documentElement.style.setProperty('--bg-bottom', rgb(th.bot));
            document.documentElement.style.setProperty('--accent', rgb(th.acc));
            document.documentElement.style.setProperty('--glow',
                `rgba(${th.acc[0]},${th.acc[1]},${th.acc[2]},0.12)`);
            // Text color: invert the background brightness for contrast
            const avg = (th.top[0] + th.top[1] + th.top[2] + th.bot[0] + th.bot[1] + th.bot[2]) / 6;
            const textLight = avg < 128;
            document.documentElement.style.setProperty('--text-color',
                textLight ? 'rgba(255, 255, 255, 0.85)' : 'rgba(10, 10, 20, 0.85)');
            document.body.style.background =
                `linear-gradient(170deg, ${rgb(th.top)} 0%, ${rgb(th.bot)} 100%)`;
            return th;
        }

        // =====================================================
        //  BOIDS FLOCKING SIMULATION
        // =====================================================

        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse tracking
        const mouse = { x: -9999, y: -9999, active: false };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
        });
        window.addEventListener('mouseleave', () => { mouse.active = false; });
        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.active = false; });

        // Boid parameters
        const BOID_COUNT = 150;
        const MAX_SPEED = 1;
        const MIN_SPEED = 1.2;
        const MAX_FORCE = 0.045;     // gentle steering = smooth arcs
        const PERCEPTION = 90;       // wider neighborhood = larger flocks
        const SEP_RADIUS = 24;       // separation distance
        const MOUSE_RADIUS = 170;    // mouse repulsion range
        const MOUSE_FORCE = 0.35;    // mouse repulsion strength
        const EDGE_MARGIN = 80;
        const EDGE_FORCE = 0.15;

        // Weights for the three rules
        const W_SEP = 1.5;
        const W_ALI = 1.2;
        const W_COH = 0.8;

        class Boid {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (MAX_SPEED - MIN_SPEED) + MIN_SPEED;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.ax = 0;
                this.ay = 0;
            }

            applyForce(fx, fy) {
                this.ax += fx;
                this.ay += fy;
            }

            // Steer towards a target velocity
            steer(tx, ty) {
                // desired minus current
                let sx = tx - this.vx;
                let sy = ty - this.vy;
                const mag = Math.hypot(sx, sy);
                if (mag > MAX_FORCE) { sx = sx / mag * MAX_FORCE; sy = sy / mag * MAX_FORCE; }
                return [sx, sy];
            }

            flock(boids) {
                let sepX = 0, sepY = 0, sepN = 0;
                let aliX = 0, aliY = 0, aliN = 0;
                let cohX = 0, cohY = 0, cohN = 0;

                for (const other of boids) {
                    if (other === this) continue;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < SEP_RADIUS && dist > 0) {
                        sepX -= dx / dist / dist;
                        sepY -= dy / dist / dist;
                        sepN++;
                    }
                    if (dist < PERCEPTION) {
                        aliX += other.vx;
                        aliY += other.vy;
                        aliN++;
                        cohX += other.x;
                        cohY += other.y;
                        cohN++;
                    }
                }

                // Separation
                if (sepN > 0) {
                    const mag = Math.hypot(sepX, sepY);
                    if (mag > 0) {
                        sepX = sepX / mag * MAX_SPEED;
                        sepY = sepY / mag * MAX_SPEED;
                    }
                    const [sx, sy] = this.steer(sepX, sepY);
                    this.applyForce(sx * W_SEP, sy * W_SEP);
                }

                // Alignment
                if (aliN > 0) {
                    aliX /= aliN; aliY /= aliN;
                    const mag = Math.hypot(aliX, aliY);
                    if (mag > 0) { aliX = aliX / mag * MAX_SPEED; aliY = aliY / mag * MAX_SPEED; }
                    const [sx, sy] = this.steer(aliX, aliY);
                    this.applyForce(sx * W_ALI, sy * W_ALI);
                }

                // Cohesion
                if (cohN > 0) {
                    cohX = cohX / cohN - this.x;
                    cohY = cohY / cohN - this.y;
                    const mag = Math.hypot(cohX, cohY);
                    if (mag > 0) { cohX = cohX / mag * MAX_SPEED; cohY = cohY / mag * MAX_SPEED; }
                    const [sx, sy] = this.steer(cohX, cohY);
                    this.applyForce(sx * W_COH, sy * W_COH);
                }
            }

            avoidMouse() {
                if (!mouse.active) return;
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.hypot(dx, dy);
                if (dist < MOUSE_RADIUS && dist > 0) {
                    const strength = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
                    this.applyForce(dx / dist * strength, dy / dist * strength);
                }
            }

            avoidEdges() {
                const w = canvas.width, h = canvas.height;
                if (this.x < EDGE_MARGIN) this.applyForce(EDGE_FORCE * (1 - this.x / EDGE_MARGIN), 0);
                if (this.x > w - EDGE_MARGIN) this.applyForce(-EDGE_FORCE * (1 - (w - this.x) / EDGE_MARGIN), 0);
                if (this.y < EDGE_MARGIN) this.applyForce(0, EDGE_FORCE * (1 - this.y / EDGE_MARGIN));
                if (this.y > h - EDGE_MARGIN) this.applyForce(0, -EDGE_FORCE * (1 - (h - this.y) / EDGE_MARGIN));
            }

            update() {
                this.vx += this.ax;
                this.vy += this.ay;
                // Clamp speed to range [MIN_SPEED, MAX_SPEED]
                const speed = Math.hypot(this.vx, this.vy);
                if (speed > MAX_SPEED) {
                    this.vx = this.vx / speed * MAX_SPEED;
                    this.vy = this.vy / speed * MAX_SPEED;
                } else if (speed < MIN_SPEED && speed > 0) {
                    this.vx = this.vx / speed * MIN_SPEED;
                    this.vy = this.vy / speed * MIN_SPEED;
                }
                this.x += this.vx;
                this.y += this.vy;
                this.ax = 0;
                this.ay = 0;

                // Wrap as fallback
                const w = canvas.width, h = canvas.height;
                if (this.x < -20) this.x = w + 20;
                if (this.x > w + 20) this.x = -20;
                if (this.y < -20) this.y = h + 20;
                if (this.y > h + 20) this.y = -20;
            }
        }

        // Initialize boids in a few clusters (swarms)
        const boids = [];
        const SWARM_COUNT = 4;
        for (let s = 0; s < SWARM_COUNT; s++) {
            const cx = Math.random() * canvas.width;
            const cy = Math.random() * canvas.height;
            const n = Math.floor(BOID_COUNT / SWARM_COUNT);
            for (let i = 0; i < n; i++) {
                boids.push(new Boid(
                    cx + (Math.random() - 0.5) * 120,
                    cy + (Math.random() - 0.5) * 120
                ));
            }
        }

        let currentAccent = [0, 210, 255];

        // --- Background star particles ---
        const stars = [];
        const STAR_COUNT = Math.min(140, Math.floor(window.innerWidth * window.innerHeight / 7000));
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.6 + 0.3,
                dx: (Math.random() - 0.5) * 0.12,
                dy: (Math.random() - 0.5) * 0.12,
                base: Math.random() * 0.55 + 0.15,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.001 + 0.0004
            });
        }

        function drawStars(time) {
            const [r, g, b] = currentAccent;
            const pr = Math.round(r + (255 - r) * 0.75);
            const pg = Math.round(g + (255 - g) * 0.75);
            const pb = Math.round(b + (255 - b) * 0.75);

            for (const s of stars) {
                s.x += s.dx;
                s.y += s.dy;
                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                const twinkle = Math.sin(time * s.speed + s.phase) * 0.4 + 0.6;
                const alpha = s.base * twinkle;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${pr},${pg},${pb},${alpha})`;
                ctx.fill();
            }
        }

        // --- Combined render loop ---
        function drawFrame(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Particles first (behind boids)
            drawStars(time || 0);

            // Boids on top
            const [cr, cg, cb] = currentAccent;
            const br = Math.round(cr + (255 - cr) * 0.6);
            const bg = Math.round(cg + (255 - cg) * 0.6);
            const bb = Math.round(cb + (255 - cb) * 0.6);

            for (const b of boids) {
                b.flock(boids);
                b.avoidMouse();
                b.avoidEdges();
                b.update();

                const angle = Math.atan2(b.vy, b.vx);
                const speed = Math.hypot(b.vx, b.vy);
                const alpha = 0.35 + (speed / MAX_SPEED) * 0.45;
                const size = 3.5;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(size * 1.6, 0);
                ctx.lineTo(-size, size * 0.7);
                ctx.lineTo(-size * 0.4, 0);
                ctx.lineTo(-size, -size * 0.7);
                ctx.closePath();
                ctx.fillStyle = `rgba(${br},${bg},${bb},${alpha})`;
                ctx.fill();
                ctx.restore();
            }
        }

        (function animate(t) {
            drawFrame(t);
            requestAnimationFrame(animate);
        })();

        // =====================================================
        //  KINETIC CLOCK CLASSES
        // =====================================================

        class KineticClock {
            constructor(parent, idx) {
                this.el = document.createElement('div');
                this.el.className = 'clock';
                this.hh = document.createElement('div');
                this.hh.className = 'hand hour';
                this.mm = document.createElement('div');
                this.mm.className = 'hand minute';
                this.el.appendChild(this.hh);
                this.el.appendChild(this.mm);
                parent.appendChild(this.el);

                const d = idx * 0.002;
                this.hh.style.transitionDelay = `${d}s`;
                this.mm.style.transitionDelay = `${d}s`;
                this.ch = 0; this.cm = 0;
                this.setAngles(225, 225);
            }

            setAngles(h, m) {
                while (this.ch % 360 !== h % 360) this.ch++;
                while (this.cm % 360 !== m % 360) this.cm++;
                this.hh.style.transform = `rotate(${this.ch}deg)`;
                this.mm.style.transform = `rotate(${this.cm}deg)`;
                this.hh.classList.toggle('active', h % 360 !== 225);
                this.mm.classList.toggle('active', m % 360 !== 225);
            }

            spin(delay) {
                setTimeout(() => {
                    this.ch += 360; this.cm += 360;
                    this.hh.style.transform = `rotate(${this.ch}deg)`;
                    this.mm.style.transform = `rotate(${this.cm}deg)`;
                }, delay);
            }
        }

        class DigitGrid {
            constructor(parent) {
                this.grid = document.createElement('div');
                this.grid.className = 'digit-grid';
                parent.appendChild(this.grid);
                this.clocks = [];
                for (let i = 0; i < 96; i++) {
                    this.clocks.push(new KineticClock(this.grid, i));
                }
            }

            render(ch) {
                const pat = C[ch] || C[' '];
                pat.forEach((sym, i) => {
                    const ang = A[sym] || A['.'];
                    this.clocks[i].setAngles(ang[0], ang[1]);
                });
            }

            spinWave(offset) {
                this.clocks.forEach((c, i) => {
                    const col = Math.floor((i % 8) / 2);
                    c.spin((offset * 4 + col) * 80);
                });
            }

            ripple(ox, oy) {
                this.clocks.forEach(c => {
                    const r = c.el.getBoundingClientRect();
                    const dist = Math.hypot(r.left + r.width / 2 - ox, r.top + r.height / 2 - oy);
                    c.spin(dist * 3);
                });
            }
        }

        // =====================================================
        //  COUNTDOWN SETUP
        // =====================================================

        const TARGET = new Date('2026-06-08T00:00:00');

        const groups = {
            days: { el: document.getElementById('g-days'), count: 3, grids: [] },
            hours: { el: document.getElementById('g-hours'), count: 2, grids: [] },
            mins: { el: document.getElementById('g-mins'), count: 2, grids: [] },
            secs: { el: document.getElementById('g-secs'), count: 2, grids: [] },
        };

        // Create digit grids
        for (const key in groups) {
            const g = groups[key];
            for (let i = 0; i < g.count; i++) {
                const dg = new DigitGrid(g.el);
                g.grids.push(dg);
            }
        }

        // Click ripple on the panel
        document.getElementById('panel').addEventListener('click', e => {
            for (const key in groups) {
                groups[key].grids.forEach(g => g.ripple(e.clientX, e.clientY));
            }
        });

        // Track previous values to skip redundant renders
        let prev = { d: '', h: '', m: '', s: '' };

        function updateCountdown() {
            const now = new Date();
            let diff = Math.max(0, TARGET - now);
            const totalSecs = Math.floor(diff / 1000);

            const d = Math.floor(totalSecs / 86400);
            const h = Math.floor((totalSecs % 86400) / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;

            const dStr = String(d).padStart(3, '0');
            const hStr = String(h).padStart(2, '0');
            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');

            if (dStr !== prev.d) { groups.days.grids.forEach((g, i) => g.render(dStr[i])); prev.d = dStr; }
            if (hStr !== prev.h) { groups.hours.grids.forEach((g, i) => g.render(hStr[i])); prev.h = hStr; }
            if (mStr !== prev.m) { groups.mins.grids.forEach((g, i) => g.render(mStr[i])); prev.m = mStr; }
            if (sStr !== prev.s) { groups.secs.grids.forEach((g, i) => g.render(sStr[i])); prev.s = sStr; }
        }

        // =====================================================
        //  INIT
        // =====================================================

        // Letter click interaction
        document.querySelectorAll('.title .letter').forEach(el => {
            el.addEventListener('click', () => {
                el.classList.remove('pop');
                void el.offsetWidth; // reflow to restart animation
                el.classList.add('pop');
            });
            el.addEventListener('animationend', () => el.classList.remove('pop'));
        });

        // Apply time-of-day theme & update every 30s
        const theme = applyTheme();
        currentAccent = theme.acc;
        setInterval(() => {
            const th = applyTheme();
            currentAccent = th.acc;
        }, 30000);

        // Show countdown instantly (no transition), then enable transitions for updates
        document.documentElement.style.setProperty('--transition-speed', '0s');
        updateCountdown();
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                document.documentElement.style.setProperty('--transition-speed', '0.8s');
                setInterval(updateCountdown, 1000);
            });
        });

        // =====================================================
        //  CONTACT FORM
        // =====================================================

        const form = document.getElementById('contactForm');
        const formStatus = document.getElementById('formStatus');
        const submitBtn = document.getElementById('formSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            formStatus.textContent = '';
            formStatus.className = 'form-status';

            const data = new FormData(form);
            try {
                const res = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: data
                });
                const json = await res.json();
                if (json.success) {
                    formStatus.textContent = 'Sent! we\'ll get back to you soon.';
                    formStatus.className = 'form-status success';
                    form.reset();
                } else {
                    throw new Error(json.message || 'Something went wrong');
                }
            } catch (err) {
                formStatus.textContent = err.message || 'Failed to send. Try again.';
                formStatus.className = 'form-status error';
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send';
        });
    </script>
</body>
